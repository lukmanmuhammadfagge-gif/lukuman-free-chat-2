name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Print debug keystore SHA-1 and SHA-256
        run: |
          keytool -list -v \
            -keystore lukuman-debug.keystore \
            -alias lukumandebug \
            -storepass android \
            -keypass android \
            -storetype PKCS12

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure google-services.json for CI build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat <<'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "lukuman-free-chat-ci",
              "storage_bucket": "lukuman-free-chat-ci.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.lukuman.freechat"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "100000000000-ciplaceholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIPlaceholderKeyForGitHubActionsBuildOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename Debug APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk Lukuman-Free-Chat.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lukuman-Free-Chat
          path: Lukuman-Free-Chat.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Lukuman Free Chat (Build #${{ github.run_number }})
          make_latest: true
          files: Lukuman-Free-Chat.apk
